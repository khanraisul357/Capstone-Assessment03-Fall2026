server.port=8080
spring.application.name=food-rescue

spring.datasource.url=jdbc:h2:mem:foodrescuedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Offer sent to ONE shelter; if it does not answer within this many minutes it is passed to the next one
app.offer-timeout-minutes=5

# Return readable error messages ({"message": "..."}) to the React app
server.error.include-message=always
